# render.yaml — Alex IO
# Infrastructure as Code — 2 servicios

services:

  # ── 1. Alex IO: FastAPI + Python ──────────────────────
  - type: web
    name: alexio-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: >
      uvicorn main:app
      --host 0.0.0.0
      --port $PORT
      --workers 2
      --log-level info
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # ← setear en Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: alexio-redis
          type: redis
          property: connectionString
      - key: ALEXIO_API_KEY
        generateValue: true  # ← Render genera automáticamente
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # ── 2. Redis: rate limiting + cache de catálogo/IA ────
  - type: redis
    name: alexio-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []          # solo acceso interno entre servicios
